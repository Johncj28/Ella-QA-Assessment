# Full stack: API + PostgreSQL.
#
#   cp .env.example .env          # once
#   docker compose up -d --build
#   curl http://localhost:4000/health
#
# Variables are read from .env. Missing required values fail fast with a clear message
# instead of starting a half-configured stack.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # The database is NOT published to the host by default: only the API talks to it over
    # the compose network. This also avoids clashing with a local Postgres on 5432.
    # Need host access (psql, migrations from the host)? Use docker-compose.dev.yml.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # $$ = escape, so the variables are expanded inside the container
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: ella-api:${APP_VERSION:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the DB is reachable as `db:5432`, whatever the
      # host-side values in .env are (e.g. DB_HOST=localhost, DB_PORT=5433).
      DB_HOST: db
      DB_PORT: 5432
      PORT: 4000
      NODE_ENV: production
    ports:
      - '${API_HOST_PORT:-4000}:4000'
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck is defined in the Dockerfile (GET /health). `docker compose ps` shows it.

volumes:
  db_data:
