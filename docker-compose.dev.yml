# Local development: database only. Run the API on the host with `npm run start:dev`.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# The DB is published on the host so the app and TypeORM CLI (DB_HOST=localhost) can reach it.
# If you already run PostgreSQL locally on 5432, set DB_HOST_PORT=5433 and DB_PORT=5433 in .env.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - '${DB_HOST_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
