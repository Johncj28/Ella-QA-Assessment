# Reporting stack: k6 -> InfluxDB -> Grafana
#
#   docker compose -f grafana/docker-compose.yml up -d
#   k6 run --out influxdb=http://localhost:8086/k6 tests/user/load.js
#   open http://localhost:3000   (dashboard "Ella API - k6 Performance" opens as the home page)
#
# Anonymous admin access is enabled for convenience: local use only, do not expose these ports.
services:
  influxdb:
    image: influxdb:1.8.10
    container_name: ella-perf-influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_MAX_BODY_SIZE: "0"
    volumes:
      - influxdb-data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/ping"]
      interval: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ella-perf-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ella-k6-dashboard.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  influxdb-data:
  grafana-data:
