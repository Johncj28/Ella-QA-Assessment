serenity {
  environment = "qa"  # Can be overridden with -Dserenity.environment=...
  outputDirectory = "target/site/serenity"
  #logging = "VERBOSE"
  serenity.logging = DEBUG
  console {
    colors = true
  }

  # Ensure Serenity doesn't suppress or redirect RestAssured logs
  output.capture = true
}

# Ella API: no login or device headers needed; only the base URL differs per environment.
environments {
  dev {
    base {
      url = "http://localhost:4000/"
    }
  }

  qa {
    base {
      url = "http://localhost:4000/"
    }
  }

  # Replace with the real staging host (see devops/environment-notes.md)
  staging {
    base {
      url = "https://staging.example.com/"
    }
  }
}

# mvn clean verify -Dserenity.environment=qa
